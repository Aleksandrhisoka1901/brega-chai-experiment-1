name: Release

on:
  push:
    tags:
      - release-*

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/aleksandr190101996/brega-chai

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require SemVer tag on main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match release-X.Y.Z" >&2
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  quality:
    name: Full quality gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Build ${{ matrix.app }} image
    needs:
      - validate
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - web
          - cms
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: production
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  container-smoke:
    name: Container smoke
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test published images
        env:
          WEB_IMAGE: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          CMS_IMAGE: ${{ env.IMAGE_PREFIX }}-cms:${{ github.sha }}
        run: |
          set -eu
          cleanup() {
            docker rm -f smoke-web smoke-cms smoke-postgres >/dev/null 2>&1 || true
            docker network rm brega-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker network create brega-smoke
          docker run -d --name smoke-postgres --network brega-smoke \
            -e POSTGRES_DB=brega \
            -e POSTGRES_USER=brega \
            -e POSTGRES_PASSWORD=ci-only-password \
            postgres:16.10-alpine3.22
          attempt=0
          until docker exec smoke-postgres pg_isready -U brega -d brega; do
            attempt=$((attempt + 1))
            test "$attempt" -lt 30
            sleep 2
          done

          docker run -d --name smoke-cms --network brega-smoke \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=1337 \
            -e DATABASE_CLIENT=postgres \
            -e DATABASE_HOST=smoke-postgres \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=brega \
            -e DATABASE_USERNAME=brega \
            -e DATABASE_PASSWORD=ci-only-password \
            -e APP_KEYS=ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4 \
            -e API_TOKEN_SALT=ci-api-token-salt \
            -e ADMIN_JWT_SECRET=ci-admin-jwt-secret \
            -e TRANSFER_TOKEN_SALT=ci-transfer-token-salt \
            -e JWT_SECRET=ci-jwt-secret \
            -e ENCRYPTION_KEY=ci-encryption-key \
            "$CMS_IMAGE"
          docker run -d --name smoke-web --network brega-smoke \
            -e CMS_INTERNAL_URL=http://smoke-cms:1337 \
            "$WEB_IMAGE"

          attempt=0
          until docker exec smoke-cms node -e \
            "fetch('http://127.0.0.1:1337/admin').then(r=>{if(!r.ok&&r.status!==302)process.exit(1)}).catch(()=>process.exit(1))"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 45 ]; then
              docker logs smoke-cms
              exit 1
            fi
            sleep 2
          done

          attempt=0
          until docker exec smoke-web node -e \
            "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              docker logs smoke-web
              exit 1
            fi
            sleep 2
          done

  deploy:
    name: Deploy production
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SMOKE_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SMOKE_URL: ${{ vars.SMOKE_URL }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure SSH
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$SMOKE_URL"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
      - name: Transfer reviewed deployment configuration
        run: |
          ssh_options="-i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          tar -czf "$RUNNER_TEMP/deploy-config.tar.gz" \
            docker-compose.yml \
            docker-compose.production.yml \
            docker-compose.tls.yml \
            infra \
            scripts
          scp $ssh_options "$RUNNER_TEMP/deploy-config.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy-config.tar.gz"
          ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && tar -xzf deploy-config.tar.gz && rm deploy-config.tar.gz"
      - name: Deploy immutable images
        env:
          WEB_IMAGE: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          CMS_IMAGE: ${{ env.IMAGE_PREFIX }}-cms:${{ github.sha }}
        run: |
          ssh_options="-i $RUNNER_TEMP/ssh/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          printf '%s' "$GHCR_TOKEN" | ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh $ssh_options "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && DEPLOY_COMMIT_SHA='$GITHUB_SHA' WEB_IMAGE='$WEB_IMAGE' CMS_IMAGE='$CMS_IMAGE' SMOKE_URL='$SMOKE_URL' ./scripts/deploy.sh"
