# Timeweb public edge for the experiment stack (project my-tea).
# Do not use this file on bregalliance.ru.
# The storefront runs a production Next.js image; CMS stays on the bind-mounted develop target.
services:
  web:
    build: !override
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    environment:
      NODE_ENV: production
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      cms:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cms:
    ports: !reset []

  postgres:
    ports: !reset []

  rustfs:
    ports: !reset []

  nginx:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/timeweb-templates:/etc/nginx/templates:ro
      - ./infra/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./infra/nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - certbot_challenges:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      cms:
        condition: service_healthy
      rustfs:
        condition: service_started

  certbot:
    image: certbot/certbot:v5.1.0
    profiles:
      - tls
    volumes:
      - certbot_challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot_challenges:
  letsencrypt:
