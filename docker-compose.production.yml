x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE}
    build: !reset null
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      cms:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  cms:
    image: ${CMS_IMAGE:?Set immutable CMS_IMAGE}
    build: !reset null
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    logging: *default-logging

  postgres:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging

  rustfs:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging

  nginx:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./infra/nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - certbot_challenges:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      cms:
        condition: service_healthy
      rustfs:
        condition: service_started
    logging: *default-logging

volumes:
  certbot_challenges:
  letsencrypt:
