x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE}
    build: !reset null
    restart: unless-stopped
    env_file: !reset []
    environment: !override
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:?Set CMS_INTERNAL_URL}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:?Set NEXT_PUBLIC_CMS_URL}
      NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL:?Set NEXT_PUBLIC_MEDIA_URL}
      CHECKOUT_FORM_SECRET: ${CHECKOUT_FORM_SECRET:?Set CHECKOUT_FORM_SECRET}
      STRAPI_ORDER_TOKEN: ${STRAPI_ORDER_TOKEN:?Set STRAPI_ORDER_TOKEN}
      CACHE_REVALIDATION_SECRET: ${CACHE_REVALIDATION_SECRET:?Set CACHE_REVALIDATION_SECRET}
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      cms:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  cms:
    image: ${CMS_IMAGE:?Set immutable CMS_IMAGE}
    build: !reset null
    restart: unless-stopped
    env_file: !reset []
    environment: !override
      NODE_ENV: production
      SEED_ALLOWED: "false"
      HOST: ${HOST:?Set HOST}
      PORT: ${PORT:?Set PORT}
      STRAPI_URL: ${STRAPI_URL:?Set STRAPI_URL}
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?Set EMAIL_PROVIDER}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?Set EMAIL_REPLY_TO}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_URL: ${MAILGUN_URL:-https://api.mailgun.net}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-5000}
      SITE_URL: ${SITE_URL:?Set SITE_URL}
      CACHE_REVALIDATION_URL: ${CACHE_REVALIDATION_URL:?Set CACHE_REVALIDATION_URL}
      CACHE_REVALIDATION_SECRET: ${CACHE_REVALIDATION_SECRET:?Set CACHE_REVALIDATION_SECRET}
      CACHE_REVALIDATION_TIMEOUT_MS: ${CACHE_REVALIDATION_TIMEOUT_MS:-3000}
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER:?Set UPLOAD_PROVIDER}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_ACCESS_SECRET: ${S3_ACCESS_SECRET:?Set S3_ACCESS_SECRET}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?Set MEDIA_PUBLIC_URL}
    ports: !reset []
    volumes: !reset []
    depends_on: !override
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    logging: *default-logging

  postgres:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging

  rustfs:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging

  nginx:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?Set RUSTFS_BUCKET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./infra/nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - certbot_challenges:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      cms:
        condition: service_healthy
      rustfs:
        condition: service_started
    logging: *default-logging

volumes:
  certbot_challenges:
  letsencrypt:
