stages:
  - quality
  - test
  - build
  - e2e
  - image
  - smoke
  - deploy

default:
  image: node:22.18.0-alpine3.22
  interruptible: true
  before_script:
    - corepack enable
    - yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache/

variables:
  YARN_ENABLE_GLOBAL_CACHE: "false"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TLS_RENEWAL == "true"

.release-pipeline:
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/

format:
  stage: quality
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/**/*
        - packages/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn format:check

quality:contracts:
  stage: quality
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn turbo run lint typecheck test --filter=@brega-chai/contracts

quality:web:
  stage: quality
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/web/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn turbo run lint typecheck test --filter=@brega-chai/web

quality:cms:
  stage: quality
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/cms/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn turbo run lint typecheck test --filter=@brega-chai/cms

pipeline:guard:
  stage: quality
  image: alpine:3.22.1
  before_script: []
  cache: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Change-based pipeline created"

validate:release:
  stage: quality
  image: alpine/git:2.49.1
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH" --depth 1
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"

integration:commerce:
  stage: test
  image: node:22.18.0-bookworm-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/cms/**/*
        - apps/web/src/app/api/checkout/**/*
        - apps/web/tests/integration/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  services:
    - name: postgres:16.10-alpine3.22
      alias: postgres
  variables:
    POSTGRES_DB: brega_chai_test
    POSTGRES_USER: brega
    POSTGRES_PASSWORD: ci-only-password
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: brega_chai_test
    DATABASE_USERNAME: brega
    DATABASE_PASSWORD: ci-only-password
    ORDER_PG_TEST_ALLOW: isolated-schema
    ORDER_PG_TEST_URL: postgres://brega:ci-only-password@postgres:5432/brega_chai_test
    APP_KEYS: ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4
    API_TOKEN_SALT: ci-api-token-salt
    ADMIN_JWT_SECRET: ci-admin-jwt-secret
    TRANSFER_TOKEN_SALT: ci-transfer-token-salt
    JWT_SECRET: ci-jwt-secret
    ENCRYPTION_KEY: ci-encryption-key
    SEED_ALLOWED: "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl postgresql-client
    - corepack enable
    - yarn install --immutable
    - mkdir -p apps/cms/public/uploads
  script:
    - yarn workspace @brega-chai/contracts build
    - yarn workspace @brega-chai/cms test:integration:order
    - |
      set -eu
      cleanup() {
        test -z "${web_pid:-}" || kill "$web_pid" >/dev/null 2>&1 || true
        test -z "${cms_pid:-}" || kill "$cms_pid" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT INT TERM

      yarn workspace @brega-chai/cms seed
      ORDER_API_TOKEN_OUTPUT_FILE=/tmp/order-api-token \
        yarn workspace @brega-chai/cms setup:order-token >/tmp/token-setup.log
      test -s /tmp/order-api-token

      yarn workspace @brega-chai/cms develop >/tmp/cms.log 2>&1 &
      cms_pid=$!
      attempt=0
      until curl -fsS http://127.0.0.1:1337/admin >/dev/null; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 60 ]; then
          cat /tmp/cms.log
          exit 1
        fi
        sleep 2
      done

      CHECKOUT_FORM_SECRET=ci-checkout-form-secret \
      STRAPI_ORDER_TOKEN="$(cat /tmp/order-api-token)" \
      CMS_INTERNAL_URL=http://127.0.0.1:1337 \
        yarn workspace @brega-chai/web dev >/tmp/web.log 2>&1 &
      web_pid=$!
      attempt=0
      until curl -fsS http://127.0.0.1:3000/api/checkout/orders >/dev/null; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 60 ]; then
          cat /tmp/web.log
          exit 1
        fi
        sleep 2
      done

      ORDER_HTTP_TEST_ALLOW=seeded-local-database \
      ORDER_HTTP_TEST_WEB_URL=http://127.0.0.1:3000 \
        yarn workspace @brega-chai/web test:integration:order

build:web:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/web/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn turbo run build --filter=@brega-chai/web

build:cms:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/cms/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
  script:
    - yarn turbo run build --filter=@brega-chai/cms

e2e:web:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.55.1-noble
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/playwright.config.ts
        - apps/web/src/app/**/*
        - apps/web/src/components/**/*
        - apps/web/src/features/**/*
        - apps/web/src/server/cms/**/*
        - apps/web/tests/e2e/**/*
        - apps/web/tests/fixtures/**/*
        - packages/contracts/**/*
        - .gitlab-ci.yml
        - package.json
        - yarn.lock
        - turbo.json
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
      when: manual
      allow_failure: true
  script:
    - yarn test:e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/

.container-image:
  extends: .release-pipeline
  stage: image
  image: docker:27.5.1-cli-alpine3.21
  services:
    - name: docker:27.5.1-dind-alpine3.21
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  needs:
    - format
    - quality:contracts
    - quality:web
    - quality:cms
    - integration:commerce
    - build:web
    - build:cms
    - e2e:web

image:web:
  extends: .container-image
  script:
    - docker build --target production -f apps/web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"

image:cms:
  extends: .container-image
  script:
    - docker build --target production -f apps/cms/Dockerfile -t "$CI_REGISTRY_IMAGE/cms:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/cms:$CI_COMMIT_SHA"

container:smoke:
  extends: .release-pipeline
  stage: smoke
  image: docker:27.5.1-cli-alpine3.21
  services:
    - name: docker:27.5.1-dind-alpine3.21
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - image:web
    - image:cms
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      set -eu
      cleanup() {
        docker rm -f smoke-web smoke-cms smoke-postgres >/dev/null 2>&1 || true
        docker network rm brega-smoke >/dev/null 2>&1 || true
      }
      trap cleanup EXIT INT TERM
      docker network create brega-smoke
      docker run -d --name smoke-postgres --network brega-smoke \
        -e POSTGRES_DB=brega \
        -e POSTGRES_USER=brega \
        -e POSTGRES_PASSWORD=ci-only-password \
        postgres:16.10-alpine3.22
      attempt=0
      until docker exec smoke-postgres pg_isready -U brega -d brega; do
        attempt=$((attempt + 1))
        test "$attempt" -lt 30
        sleep 2
      done
      docker run -d --name smoke-cms --network brega-smoke \
        -e NODE_ENV=production \
        -e HOST=0.0.0.0 \
        -e PORT=1337 \
        -e DATABASE_CLIENT=postgres \
        -e DATABASE_HOST=smoke-postgres \
        -e DATABASE_PORT=5432 \
        -e DATABASE_NAME=brega \
        -e DATABASE_USERNAME=brega \
        -e DATABASE_PASSWORD=ci-only-password \
        -e APP_KEYS=ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4 \
        -e API_TOKEN_SALT=ci-api-token-salt \
        -e ADMIN_JWT_SECRET=ci-admin-jwt-secret \
        -e TRANSFER_TOKEN_SALT=ci-transfer-token-salt \
        -e JWT_SECRET=ci-jwt-secret \
        -e ENCRYPTION_KEY=ci-encryption-key \
        "$CI_REGISTRY_IMAGE/cms:$CI_COMMIT_SHA"
      docker run -d --name smoke-web --network brega-smoke \
        "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
      attempt=0
      until docker exec smoke-cms node -e \
        "fetch('http://127.0.0.1:1337/admin').then(r=>{if(!r.ok&&r.status!==302)process.exit(1)}).catch(()=>process.exit(1))"; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 45 ]; then
          docker logs smoke-cms
          exit 1
        fi
        sleep 2
      done
      attempt=0
      until docker exec smoke-web node -e \
        "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 30 ]; then
          docker logs smoke-web
          exit 1
        fi
        sleep 2
      done

deploy:production:
  stage: deploy
  image: alpine:3.22.1
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - test -f "$DEPLOY_SSH_PRIVATE_KEY"
    - test -n "$DEPLOY_KNOWN_HOSTS"
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_PATH"
    - test -n "$SMOKE_URL"
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" /tmp/deploy_key
    - install -m 700 -d ~/.ssh
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  needs:
    - validate:release
    - e2e:web
    - container:smoke
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
  environment:
    name: production
  script:
    - ssh -i /tmp/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - tar -czf /tmp/deploy-config.tar.gz docker-compose.yml docker-compose.production.yml docker-compose.tls.yml infra scripts
    - scp -i /tmp/deploy_key /tmp/deploy-config.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy-config.tar.gz"
    - ssh -i /tmp/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && tar -xzf deploy-config.tar.gz && rm deploy-config.tar.gz"
    - printf '%s' "$CI_REGISTRY_PASSWORD" | ssh -i /tmp/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh -i /tmp/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && WEB_IMAGE='$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA' CMS_IMAGE='$CI_REGISTRY_IMAGE/cms:$CI_COMMIT_SHA' SMOKE_URL='$SMOKE_URL' ./scripts/deploy.sh"

tls:renew:
  stage: deploy
  image: alpine:3.22.1
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - test -f "$DEPLOY_SSH_PRIVATE_KEY"
    - test -n "$DEPLOY_KNOWN_HOSTS"
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_PATH"
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" /tmp/deploy_key
    - install -m 700 -d ~/.ssh
    - printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TLS_RENEWAL == "true"
  script:
    - ssh -i /tmp/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./scripts/tls-renew.sh"
