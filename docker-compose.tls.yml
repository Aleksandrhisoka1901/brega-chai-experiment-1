name: brega-chai

services:
  nginx-bootstrap:
    image: nginx:1.28.0-alpine3.21
    ports:
      - "80:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN}
    volumes:
      - ./infra/nginx/bootstrap-templates:/etc/nginx/templates:ro
      - certbot_challenges:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:v5.1.0
    volumes:
      - certbot_challenges:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  certbot_challenges:
  letsencrypt:
